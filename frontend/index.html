<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Robot</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        #app {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            color: #444;
        }
        textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 1rem;
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        label {
            font-weight: bold;
            margin-bottom: 0.25rem;
            display: block;
        }
        select, input[type="range"] {
            width: 100%;
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        audio {
            width: 100%;
            margin-top: 1rem;
        }
        #status {
            text-align: center;
            margin-top: 1rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>TTS Robot</h1>
        <textarea id="text-input" placeholder="Enter text to synthesize..."></textarea>
        <div class="controls">
            <div>
                <label for="voice-select">Voice</label>
                <select id="voice-select">
                    <option value="alloy">Alloy</option>
                    <option value="echo">Echo</option>
                    <option value="fable">Fable</option>
                    <option value="onyx">Onyx</option>
                    <option value="nova">Nova</option>
                    <option value="shimmer">Shimmer</option>
                </select>
            </div>
            <div>
                <label for="speed-control">Speed</label>
                <input type="range" id="speed-control" min="0.5" max="2.0" step="0.1" value="1.0">
            </div>
        </div>
        <button id="generate-btn">Generate Speech</button>
        <div id="status"></div>
        <audio id="audio-output" controls></audio>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const textInput = document.getElementById('text-input');
            const voiceSelect = document.getElementById('voice-select');
            const speedControl = document.getElementById('speed-control');
            const generateBtn = document.getElementById('generate-btn');
            const statusDiv = document.getElementById('status');
            const audioOutput = document.getElementById('audio-output');

            // Set the model name from the user's request.
            const OLLAMA_MODEL = 'OuteAI/Llama-OuteTTS-1.0-1B-GGUF:Q4_K_M';
            // The user specified a remote server.
            const OLLAMA_API_URL = 'http://remoteServer:11434/api/tts';

            generateBtn.addEventListener('click', async () => {
                const text = textInput.value.trim();
                if (!text) {
                    alert('Please enter some text.');
                    return;
                }

                generateBtn.disabled = true;
                statusDiv.textContent = 'Generating audio...';
                audioOutput.src = '';

                try {
                    const response = await fetch(OLLAMA_API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            model: OLLAMA_MODEL,
                            text: text,
                            options: {
                                voice: voiceSelect.value,
                                speed: parseFloat(speedControl.value),
                            }
                        }),
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({ error: 'Failed to read error response.' }));
                        throw new Error(`Server error: ${response.status} ${response.statusText}. ${errorData.error || ''}`);
                    }

                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    audioOutput.src = audioUrl;
                    audioOutput.hidden = false;
                    audioOutput.play();
                    statusDiv.textContent = 'Audio generated successfully!';

                } catch (error) {
                    console.error('Error generating TTS:', error);
                    statusDiv.textContent = `Error: ${error.message}. Check the console and make sure the Ollama server is running and accessible with CORS enabled.`;
                    alert(`An error occurred. Please check the console for details.\n\nCommon issue: The Ollama server might not have CORS enabled, which prevents the browser from connecting to it. You may need to configure the server to allow requests from this page.`);
                } finally {
                    generateBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
